id: openai-o
name: "OpenAI o-series"
provider: openai
kind: model
version: 1.0.0
model:
  provider: openai
  endpoint: "https://api.openai.com/v1/chat/completions"
  default_model: "o3"
  available_models:
    - "o3"
    - "o4-mini"
  max_tokens: 8192
  temperature: null
auth:
  method: header
  header_name: "Authorization"
  env_var: "OPENAI_API_KEY"
  required: true
capabilities:
  - code-generation
  - code-review
  - instruction-following
governance:
  injection: system-prompt
  system_prompt_file: "prompts/system.md"
  injection_file: "prompts/governance-injection.md"
  instruction_hierarchy_support: configured
verification:
  max_reachable_level: configured
  notes: "Transport implemented; behavioral verification is required before claiming verified."
rate_limits:
  timeout_seconds: 180
