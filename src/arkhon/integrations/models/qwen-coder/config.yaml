id: qwen-coder
name: "Qwen Coder"
provider: alibaba
kind: model
version: 1.0.0
model:
  provider: alibaba
  endpoint: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
  default_model: "qwen3-coder-plus"
  available_models:
    - "qwen3-coder-plus"
    - "qwen2.5-coder-32b-instruct"
  max_tokens: 8192
  temperature: 0.0
auth:
  method: header
  header_name: "Authorization"
  env_var: "DASHSCOPE_API_KEY"
  required: true
capabilities:
  - code-generation
  - code-review
  - instruction-following
governance:
  injection: system-prompt
  system_prompt_file: "prompts/system.md"
  injection_file: "prompts/governance-injection.md"
  instruction_hierarchy_support: configured
verification:
  max_reachable_level: configured
  notes: "Transport implemented; behavioral verification is required before claiming verified."
rate_limits:
  timeout_seconds: 120
