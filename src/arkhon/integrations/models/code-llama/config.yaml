# Code Llama model integration configuration.
id: code-llama
name: "Code Llama"
provider: meta
kind: model
version: 1.0.0

model:
  provider: meta
  endpoint: "http://127.0.0.1:11434/v1/chat/completions"
  default_model: "codellama:13b"
  available_models:
    - "codellama:7b"
    - "codellama:13b"
    - "codellama:34b"
  max_tokens: 4096
  temperature: 0

auth:
  method: optional
  env_var: "CODE_LLAMA_API_KEY"
  required: false

capabilities:
  - code-generation
  - local-execution

governance:
  injection: plain-text-delimited
  system_prompt_file: "prompts/system.md"
  injection_file: "prompts/governance-injection.md"
  instruction_hierarchy_support: standard

verification:
  max_reachable_level: configured
  notes: |
    Adapter configuration and transport are available. Behavioral compliance
    and model quality are not certified by this integration.

rate_limits:
  default_rpm: 60
