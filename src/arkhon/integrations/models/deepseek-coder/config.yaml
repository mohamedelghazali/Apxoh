# DeepSeek-Coder model integration configuration.
id: deepseek-coder
name: "DeepSeek-Coder"
provider: deepseek
kind: model
version: 1.0.0

model:
  provider: deepseek
  endpoint: "https://api.deepseek.com/chat/completions"
  default_model: "deepseek-chat"
  available_models:
    - "deepseek-chat"
    - "deepseek-reasoner"
  max_tokens: 8192
  temperature: 0

auth:
  method: header
  env_var: "DEEPSEEK_API_KEY"
  required: true

capabilities:
  - code-generation
  - code-review

governance:
  injection: system-prompt
  system_prompt_file: "prompts/system.md"
  injection_file: "prompts/governance-injection.md"
  instruction_hierarchy_support: standard

verification:
  max_reachable_level: configured
  notes: |
    Adapter configuration and transport are available. Behavioral compliance
    and model quality are not certified by this integration.

rate_limits:
  default_rpm: 60
