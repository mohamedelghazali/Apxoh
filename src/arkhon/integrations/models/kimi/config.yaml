# Kimi model integration configuration.
id: kimi
name: "Kimi"
provider: moonshot
kind: model
version: 1.0.0

model:
  provider: moonshot
  endpoint: "https://api.moonshot.ai/v1/chat/completions"
  default_model: "kimi-k2"
  available_models:
    - "kimi-k2"
    - "moonshot-v1-128k"
  max_tokens: 8192
  temperature: 0

auth:
  method: header
  env_var: "MOONSHOT_API_KEY"
  required: true

capabilities:
  - code-generation
  - long-context

governance:
  injection: system-prompt
  system_prompt_file: "prompts/system.md"
  injection_file: "prompts/governance-injection.md"
  instruction_hierarchy_support: standard

verification:
  max_reachable_level: configured
  notes: |
    Adapter configuration and transport are available. Behavioral compliance
    and model quality are not certified by this integration.

rate_limits:
  default_rpm: 60
