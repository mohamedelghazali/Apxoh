id: cpp
framework: googletest
minimum_version: "1.14"

coverage:
  tool: lcov
  required: true
  minimum_line_coverage: 70
  minimum_branch_coverage: 60
  fail_under: 70
  report_formats: [lcov, html]
  command: "cmake --build build --target coverage"

test_discovery:
  patterns:
    - "**/*_test.cpp"
    - "**/test_*.cpp"
  directories: [tests/, test/]

test_categories:
  unit:
    required: true
    command: "ctest --test-dir build -L unit --output-on-failure"
    timeout_seconds: 300
  integration:
    required: true
    command: "ctest --test-dir build -L integration --output-on-failure"
    timeout_seconds: 900
  sanitizers:
    required: true
    command: "ctest --test-dir build-sanitizers --output-on-failure"
    timeout_seconds: 1800
    note: "Build with -fsanitize=address,undefined"

required_flags:
  - "-Wall"
  - "-Wextra"
  - "-Werror"
  - "-fsanitize=address"
  - "-fsanitize=undefined"
