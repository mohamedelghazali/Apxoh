id: ruby
framework: rspec
minimum_version: "3.13"

coverage:
  tool: simplecov
  required: true
  minimum_line_coverage: 80
  minimum_branch_coverage: 70
  fail_under: 80
  report_formats: [html, json]
  command: "COVERAGE=true bundle exec rspec"

test_discovery:
  patterns: ["**/*_spec.rb"]
  directories: [spec/]

test_categories:
  unit:
    required: true
    command: "bundle exec rspec spec/unit"
    timeout_seconds: 300
  integration:
    required: true
    command: "bundle exec rspec spec/integration"
    timeout_seconds: 900
  regression:
    required: true
    command: "bundle exec rspec spec/regression"
    timeout_seconds: 300

required_gems:
  - rspec
  - rspec_junit_formatter
  - simplecov
