id: javascript
delegates_to: tsar

local_checks:
  secret_scanning:
    tool: gitleaks
    required: true
    invocation: "gitleaks detect --source . --no-git --report-format json"

  dependency_scanning:
    tool: npm
    required: true
    invocation: "npm audit --json --audit-level=moderate"

  dangerous_patterns:
    - pattern: "eval("
      severity: high
      reason: "eval() executes untrusted code"
    - pattern: "new Function("
      severity: high
      reason: "Function constructor is equivalent to eval"
    - pattern: "innerHTML"
      severity: medium
      reason: "Use textContent or a safe sanitizer; innerHTML enables XSS"
    - pattern: "document.write("
      severity: high
      reason: "document.write enables XSS"
    - pattern: "require('child_process').exec("
      severity: high
      reason: "exec() enables command injection"

tsar_delegation:
  required_rules:
    - TSAR-SEC-SECRET-001
    - TSAR-SEC-CRYPTO-001
    - TSAR-SEC-DEP-001
    - TSAR-SEC-ASVS-V2
  freshness_hours: 168
  gate: security_gate
  on_tsar_unavailable: BLOCKED
