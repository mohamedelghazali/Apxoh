id: javascript
tools:
  static_analysis:
    - name: eslint
      role: linter
      required: true
      invocation: "eslint . --format=json"
      output_format: json
      version_arg: "--version"

    - name: prettier
      role: formatter
      required: false
      invocation: "prettier --check ."
      output_format: text
      version_arg: "--version"

  testing:
    - name: vitest
      role: test-runner
      required: true
      invocation: "vitest run --reporter=json --reporter=junit --outputFile=junit.xml"
      output_format: junit-xml
      version_arg: "--version"

  build:
    - name: node
      role: runtime
      required: true
      invocation: "node --version"
      version_arg: "--version"

  supply_chain:
    - name: npm
      role: dependency-auditor
      required: true
      invocation: "npm audit --json"
      output_format: json
      version_arg: "--version"

    - name: license-checker
      role: license-checker
      required: false
      invocation: "npx license-checker --json"
      output_format: json

missing_tool_policy: BLOCKED
