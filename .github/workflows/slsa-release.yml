name: SLSA Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build, inventory, and sign release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Install pinned Syft and Cosign
        run: |
          go install github.com/anchore/syft/cmd/syft@v1.56.0
          go install github.com/sigstore/cosign/v3/cmd/cosign@v3.1.4
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
          sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
      - name: Generate CycloneDX source SBOM
        run: syft dir:. -o cyclonedx-json > dist/source-sbom.cdx.json
      - name: Sign every release artifact and SBOM with GitHub OIDC
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for artifact in dist/*.whl dist/*.tar.gz dist/source-sbom.cdx.json; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done
      - name: Compute distribution hashes for SLSA provenance
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum *.whl *.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Upload build outputs for provenance and verification
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  provenance:
    name: Generate SLSA provenance
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true

  verify:
    name: Verify release provenance, signatures, and Apxoh evidence acceptance
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Download generated SLSA provenance from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern '*.intoto.jsonl' --dir dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Install pinned verifiers and Syft
        run: |
          go install github.com/slsa-framework/slsa-verifier/v2/cli/slsa-verifier@v2.7.1
          go install github.com/sigstore/cosign/v3/cmd/cosign@v3.1.4
          go install github.com/anchore/syft/cmd/syft@v1.56.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Verify signatures on all release artifacts
        run: |
          set -euo pipefail
          for artifact in dist/*.whl dist/*.tar.gz dist/source-sbom.cdx.json; do
            cosign verify-blob \
              --bundle "${artifact}.sigstore.json" \
              --certificate-identity-regexp '^https://github[.]com/mohamedelghazali/Apxoh/[.]github/workflows/slsa-release[.]yml@refs/tags/v.*$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$artifact"
          done
      - name: Configure the release artifact trust inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          wheel = sorted(Path("dist").glob("*.whl"))[0]
          provenance = sorted(Path("dist").glob("*.intoto.jsonl"))[0]
          config = {
              "artifact": wheel.as_posix(),
              "provenance": provenance.as_posix(),
              "signature_bundle": Path(str(wheel) + ".sigstore.json").as_posix(),
          }
          path = Path(".arkhon/supply-chain.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Verify release artifact through Apxoh and re-accept its evidence
        run: |
          python -m pip install -e ".[dev]"
          arkhon verify . --domain supply-chain
          arkhon report .
