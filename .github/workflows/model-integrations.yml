name: model-integrations
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Test available model integration contracts
        run: python -m pytest -q tests/integration/models
      - name: Test model factories and shared transport
        run: python -m pytest -q tests/unit/integrations
      - name: Report declared versus implemented model adapters
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          manifest = yaml.safe_load(Path("manifest/integrations.yaml").read_text(encoding="utf-8"))
          declared = [item["id"] for item in manifest["integrations"]["models"]]
          root = Path("src/arkhon/integrations/models")
          implemented = sorted(
              path.parent.name for path in root.glob("*/adapter.py")
          ) if root.is_dir() else []
          print(f"Declared model integrations: {', '.join(declared)}")
          print(f"Adapter directories currently present: {', '.join(implemented) or 'none'}")
          if set(declared) != set(implemented):
              raise SystemExit(f"Model registry mismatch: declared={sorted(declared)}, implemented={implemented}")
          PY
