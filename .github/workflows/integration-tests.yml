name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fixtures:
    name: Language fixtures (${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [python, javascript, typescript, java, csharp, cpp, go, rust, ruby]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-dev.lock"
      - run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Detect fixture language
        run: |
          gencode-gov inspect tests/languages/fixtures/${{ matrix.lang }}-project --json

      - name: Fixture has correct structure
        run: |
          test -f tests/languages/fixtures/${{ matrix.lang }}-project/.gencode-gov/project.yaml
          test -f tests/languages/fixtures/${{ matrix.lang }}-project/README.md

      - name: Run fixture pytest
        run: pytest tests/languages -v -k "${{ matrix.lang }}"

  examples:
    name: Examples (inspect only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-dev.lock"
      - run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Inspect each example
        run: |
          for d in examples/*/; do
            if [ -f "$d/.gencode-gov/project.yaml" ]; then
              echo "=== $d ==="
              gencode-gov inspect "$d" --json
            fi
          done

  tsar-contract:
    name: TSAR contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-dev.lock"
      - run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Contract tests (no TSAR binary needed)
        run: pytest tests/integration/tsar/test_tsar_contract.py -v
