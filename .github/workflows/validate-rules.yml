name: Validate Rules

on:
  push:
    branches: [main]
    paths:
      - "rules/**"
      - "languages/**/rules/**"
      - "schemas/rule.schema.json"
      - "src/arkhon/rules/**"
  pull_request:
    branches: [main]
    paths:
      - "rules/**"
      - "languages/**/rules/**"
      - "schemas/rule.schema.json"
      - "src/arkhon/rules/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate rules (schema + semantics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.11", cache: "pip" }
      - run: pip install -e ".[dev]"

      - name: Run rule validator
        run: python scripts/validation/validate_all.py

      - name: Rule tests (positive + negative)
        run: pytest tests/rules/ -v --tb=short

      - name: Rule-specific tests (in languages/*)
        run: pytest tests/unit/rules/ -v --tb=short
