name: orchestrator
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle-and-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m compileall -q src/gencode_gov/orchestrator
      - run: python -m pytest -q tests/unit/orchestrator tests/unit/assessment
