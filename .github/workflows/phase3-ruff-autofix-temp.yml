name: Temporary Ruff autofix for Phase 3 follow-up

on:
  push:
    branches:
      - fix/phase-3-supply-chain-ci-and-gates-2026-11-03

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply Ruff autofix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.7.4
      - name: Apply safe import fixes and push them
        run: |
          ruff check --fix src tests scripts || true
          if git diff --quiet; then
            echo "No Ruff changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts
          git commit -m "chore: apply Ruff autofix"
          git push origin HEAD
