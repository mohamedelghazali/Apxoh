name: One-time Ruff formatting

on:
  push:
    branches: [fix/phase3-assurance-format-2026-11-03]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'Ruff formatting') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install the repository-pinned Ruff
        run: python -m pip install ruff==0.7.4
      - name: Apply safe Ruff fixes and formatting
        run: |
          ruff format src tests scripts
          ruff check --fix src tests scripts || true
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts
          git commit -m "chore: apply Ruff formatting"
          git push origin HEAD
