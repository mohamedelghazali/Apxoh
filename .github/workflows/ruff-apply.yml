name: Apply safe Ruff fixes

on:
  push:
    branches: [fix/phase-1-followup-2026-11-03]
    paths:
      - ".github/workflows/ruff-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase-1-followup-2026-11-03
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.7.4
      - name: Apply safe Ruff fixes
        run: ruff check --fix src tests scripts
      - name: Commit safe fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No safe Ruff fixes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts
          git commit -m "style: apply safe Ruff lint fixes"
          git push origin HEAD:fix/phase-1-followup-2026-11-03
