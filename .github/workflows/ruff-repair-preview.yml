name: Ruff repair preview

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "scripts/**/*.py"
      - ".github/workflows/ruff-repair-preview.yml"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.7.4
      - name: Apply safe automatic fixes
        run: ruff check --fix src tests scripts || true
      - name: Package changed Python files
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACMR HEAD -- src tests scripts | grep -E '\.py$' > /tmp/ruff-changed.txt || true
          if [ -s /tmp/ruff-changed.txt ]; then
            zip -q ruff-repair-preview.zip -@ < /tmp/ruff-changed.txt
          else
            echo "No files were changed by Ruff." > ruff-repair-preview.txt
          fi
      - name: Upload repair preview
        uses: actions/upload-artifact@v4
        with:
          name: ruff-repair-preview
          path: ruff-repair-preview.*
          if-no-files-found: error
