name: Installation Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"  # Weekly Monday 05:00 UTC

permissions:
  contents: read

jobs:
  clean-install:
    name: Clean install (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install in fresh venv
        shell: bash
        run: |
          python -m venv .venv-ci
          if [ "$RUNNER_OS" = "Windows" ]; then
            source .venv-ci/Scripts/activate
          else
            source .venv-ci/bin/activate
          fi
          python scripts/dependencies/lock_dependencies.py install --target runtime
          gencode-gov version
          gencode-gov doctor || true
          gencode-gov validate
        continue-on-error: false

  wheel-install:
    name: Wheel install + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.11" }
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock
      - run: python -m build --no-isolation
      - name: Install from wheel
        run: |
          python -m venv .venv-wheel
          source .venv-wheel/bin/activate
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip install --no-deps dist/*.whl
          python -m pip check
          gencode-gov version
          gencode-gov doctor || true
          project_dir="$(mktemp -d)"
          gencode-gov project init "$project_dir" --name "Wheel Smoke Test" --profile api-service
          test -f "$project_dir/.gencode-gov/project.yaml"
          for profile in desktop-application distributed-system enterprise mobile-application safety-critical universal web-application; do
            profile_dir="$(mktemp -d)"
            gencode-gov project init "$profile_dir" --profile "$profile"
            test -f "$profile_dir/.gencode-gov/project.yaml"
          done
          gencode-gov install --scope project --project "$project_dir"
          test -f "$project_dir/.gencode-gov/agent-pack/manifest.json"

  offline-check:
    name: Offline check (no network after install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.11" }
      - run: python scripts/dependencies/lock_dependencies.py install --target runtime
      - name: Verify core commands work without network
        run: |
          gencode-gov version
          gencode-gov doctor || true
          gencode-gov validate
