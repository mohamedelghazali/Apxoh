name: infrastructure-validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate devcontainer JSON
        run: python -m json.tool .devcontainer/devcontainer.json > /dev/null
      - name: Check devcontainer build inputs
        run: test -s .devcontainer/Dockerfile
      - name: Parse workflow YAML
        run: |
          python -m pip install pyyaml==6.0.2
          python - <<'PY'
          from pathlib import Path
          import yaml
          workflows = sorted(Path(".github/workflows").glob("*.yml"))
          if not workflows:
              raise SystemExit("No workflow YAML files found")
          for path in workflows:
              with path.open(encoding="utf-8") as stream:
                  document = yaml.safe_load(stream)
              if not isinstance(document, dict):
                  raise SystemExit(f"{path}: expected a YAML mapping")
          print(f"Parsed {len(workflows)} workflow files")
          PY
