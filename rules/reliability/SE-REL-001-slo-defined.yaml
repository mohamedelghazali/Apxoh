id: SE-REL-001
metadata:
  title: SLO Defined for Every Service
  domain: reliability
  version: 1.1.0
  status: active
  severity: high
  enforcement: blocking
  description: >
    Every production web application and service must have documented Service Level
    Objectives with an error budget, monitoring, and alerting.
scope:
  project_types: [web-application, api-service, distributed-system, enterprise]
  lifecycle_stages: [architecture, operations, release]
requirement:
  statement: >
    Every production web application and service must define measurable SLOs
    (availability, latency, error rate) with a documented error budget, continuous
    monitoring, and burn-rate alerting.
verification:
  mode: hybrid
  methods:
    - slo-document-presence
    - monitoring-config-check
    - human-review
acceptance:
  services_without_slo: 0
  error_budget_defined: true
  monitoring_configured: true
evidence:
  required:
    - slo-document
    - monitoring-config
failure:
  actions:
    - create-finding
    - block-stage
    - require-remediation
human_review:
  required: true
  approver_role: "Reliability Engineer"
tests:
  positive: required
  negative: required
  regression: required
