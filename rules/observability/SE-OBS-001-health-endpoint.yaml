id: SE-OBS-001
metadata:
  title: Health Endpoint and Safe Diagnostic Disclosure
  domain: observability
  version: 1.1.0
  status: active
  severity: high
  enforcement: blocking
  description: >
    Services need machine-readable health signals while detailed dependency and
    infrastructure diagnostics remain protected from public disclosure.
scope:
  project_types: [web-application, api-service, distributed-system, enterprise]
  lifecycle_stages: [implementation, deployment, release]
requirement:
  statement: >
    Every service must provide machine-readable liveness and readiness signals appropriate
    to its orchestrator. Public probes, if required, disclose only minimal status and must
    not expose dependency names, topology, versions, credentials, stack traces, or internal
    metadata. Detailed dependency health and diagnostic endpoints must require authenticated
    authorized operator access and must not be publicly reachable.
verification:
  mode: hybrid
  methods:
    - endpoint-detection
    - endpoint-schema-validation
    - public-health-disclosure-test
    - detailed-health-access-control-test
acceptance:
  health_signal_present: true
  health_endpoint_returns_machine_parseable_status: true
  sensitive_details_in_public_health_responses: 0
  detailed_diagnostics_publicly_accessible: 0
evidence:
  required:
    - endpoint-inventory
    - health-response-sample
    - public-disclosure-test-report
    - detailed-health-access-control-report
failure:
  actions:
    - create-finding
    - block-stage
    - require-remediation
human_review:
  required: false
tests:
  positive: required
  negative: required
  regression: required
