id: SE-SEC-010
metadata:
  title: Git History Secret Exposure Review and Remediation
  domain: software-security
  version: 1.0.0
  status: active
  severity: critical
  enforcement: critical
  description: >
    Secret scanning must include reachable repository history and exposed credentials
    must be revoked or rotated before the security finding is closed.
scope:
  project_types: [all]
  lifecycle_stages: [implementation, release, maintenance, incident-response]
requirement:
  statement: >
    Scan the current tree and reachable Git history, including branches and tags in
    scope, for credentials and private material. For every confirmed exposure, immediately
    revoke or rotate the credential with its provider, assess access during the exposure
    window, remove the secret from active content, and coordinate history rewriting only
    with repository owners. History rewriting or deletion does not replace revocation.
    Record sanitized evidence without reproducing the secret.
verification:
  mode: hybrid
  methods: [working-tree-secret-scan, git-history-secret-scan, branch-and-tag-coverage-review, credential-revocation-confirmation, incident-review]
acceptance:
  current_tree_live_secrets: 0
  reachable_history_untriaged_secrets: 0
  confirmed_exposures_without_revocation: 0
  secret_values_in_findings: 0
evidence:
  required: [current-tree-secret-scan, git-history-scan-report, sanitized-rotation-evidence, exposure-impact-assessment]
failure:
  actions: [create-finding, block-release-gate, revoke-and-rotate-credential, escalate-to-human]
human_review:
  required: true
  approver_role: Security Lead
tests:
  positive: required
  negative: required
  regression: required
