id: SE-SEC-005
metadata:
  title: Secrets and Environment Configuration Governance
  domain: software-security
  version: 1.0.0
  status: active
  severity: critical
  enforcement: critical
  description: >
    Credentials and environment-specific configuration must be separated from source
    code and protected through an approved secret-management lifecycle.
scope:
  project_types: [all]
  lifecycle_stages: [architecture, implementation, deployment, release, maintenance]
requirement:
  statement: >
    The agent must keep API keys, passwords, tokens, database credentials, signing keys,
    and private certificates out of source code, prompts, committed configuration,
    logs, test fixtures, and evidence. Load runtime secrets from an approved secret
    manager or protected deployment environment; use environment variables only as a
    delivery interface, not as a substitute for secret storage. Do not commit plaintext
    .env files; provide a sanitized .env.example. Protect secret values at rest using
    the platform secret manager's encryption and access controls, apply least privilege,
    rotation, and revocation, and never claim that base64 or ordinary dotenv storage
    is encryption.
verification:
  mode: hybrid
  methods: [secret-scanner, repository-config-review, env-file-audit, secret-manager-policy-review, log-and-evidence-redaction-review]
acceptance:
  committed_live_secrets: 0
  plaintext_env_files_tracked: 0
  hardcoded_credentials: 0
  secret_values_in_logs_or_evidence: 0
  sample_configuration_contains_only_placeholders: true
evidence:
  required: [secret-scan-sarif, environment-configuration-inventory, secret-management-review, redaction-test-report]
failure:
  actions: [create-finding, block-release-gate, revoke-and-rotate-credential, require-history-remediation]
human_review:
  required: true
  approver_role: Security Lead
tests:
  positive: required
  negative: required
  regression: required
