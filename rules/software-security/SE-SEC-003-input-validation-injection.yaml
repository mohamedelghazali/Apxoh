id: SE-SEC-003
metadata:
  title: Server-Side Input Validation and Injection Prevention
  domain: software-security
  version: 1.0.0
  status: active
  severity: critical
  enforcement: critical
  description: >
    All untrusted input must be validated at the trust boundary and safely handled
    by database, command, template, and serialization interfaces.
scope:
  project_types: [web-application, api-service, mobile-application, desktop-application, enterprise]
  lifecycle_stages: [design, implementation, testing, release]
requirement:
  statement: >
    The agent must identify every external input boundary, validate type, shape, length,
    range, encoding, and business constraints on the server, reject unexpected fields
    where appropriate, and never rely on client-side validation as a security control.
    Database access must use parameterized queries or safe ORM bindings; dynamic SQL
    identifiers must use strict allowlists. Shell commands, templates, paths, and
    deserialization must use context-appropriate safe APIs and allowlists.
verification:
  mode: hybrid
  methods: [input-boundary-inventory, server-validation-review, sql-query-review, injection-negative-tests, fuzz-or-property-tests]
acceptance:
  unvalidated_external_input_boundaries: 0
  string_concatenated_untrusted_sql: 0
  client_validation_only_controls: 0
  injection_regressions: 0
evidence:
  required: [input-boundary-inventory, validation-schema-review, query-safety-report, injection-test-report]
failure:
  actions: [create-finding, block-release-gate, require-remediation]
human_review:
  required: true
  approver_role: Application Security Engineer
tests:
  positive: required
  negative: required
  regression: required
