# GENCODE-GOV agent role bindings.
# Roles reference skills and rule domains; this file is declarative and
# does not itself enforce runtime permissions.

version: "1.2.0"

roles:
  - id: requirements-engineer
    display_name: "Requirements Engineer"
    description: "Extracts, refines, and verifies traceable requirements and data scope."
    skills: [gencode-gov, requirements-engineering]
    rule_domains: [requirements, privacy-compliance]
    outputs: [requirements-register, acceptance-criteria]

  - id: software-architect
    display_name: "Software Architect"
    description: "Designs architecture, documents decisions, produces threat and data models."
    skills: [gencode-gov, architecture-engineering, secure-software-engineering, application-security, security-audit]
    rule_domains: [architecture, software-security, database, api-integration, scalability, privacy-compliance]
    outputs: [architecture-decision-records, threat-model, component-diagram]

  - id: developer
    display_name: "Developer"
    description: "Writes secure, observable, tested code satisfying requirements and rules."
    skills: [gencode-gov, secure-software-engineering, application-security, software-testing]
    rule_domains: [code-quality, software-security, database, api-integration, observability, testing]
    outputs: [source-code, unit-tests]

  - id: code-reviewer
    display_name: "Code Reviewer"
    description: "Reviews code, migrations, and configurations for correctness and compliance."
    skills: [gencode-gov, secure-software-engineering, application-security, security-audit, software-testing]
    rule_domains: [code-quality, software-security, database, observability, performance, testing]
    outputs: [review-findings, compliance-checklist]

  - id: test-engineer
    display_name: "Test Engineer"
    description: "Designs and executes functional, regression, and negative security test suites."
    skills: [gencode-gov, software-testing, application-security]
    rule_domains: [testing, software-security]
    outputs: [test-plan, test-results, negative-security-test-report, coverage-report]

  - id: security-engineer
    display_name: "Security Engineer"
    description: "Performs application security governance, coverage-led security audits, negative verification, and TSAR audits."
    skills: [gencode-gov, secure-software-engineering, application-security, security-audit]
    rule_domains: [software-security, database, privacy-compliance, observability, testing]
    outputs: [tsar-evidence, security-findings, security-coverage-ledger, threat-model, access-control-test-report]

  - id: performance-engineer
    display_name: "Performance Engineer"
    description: "Defines latency targets, runs load tests, and configures degradation alerts."
    skills: [gencode-gov, performance-engineering]
    rule_domains: [performance, scalability, observability]
    outputs: [benchmark-results, performance-report, degradation-alert-rules]

  - id: reliability-engineer
    display_name: "Reliability Engineer"
    description: "Ensures service SLOs, private monitoring, backups, restore drills, and rollback readiness."
    skills: [gencode-gov, reliability-engineering]
    rule_domains: [reliability, observability, database, infrastructure, devops]
    outputs: [reliability-report, restore-integrity-report, rollback-drill-report]

  - id: release-manager
    display_name: "Release Manager"
    description: "Evaluates commit-bound evidence across all gates and issues release readiness decisions."
    skills: [gencode-gov, release-readiness, application-security]
    rule_domains: [release, maintenance, devops, reliability, software-security]
    outputs: [release-recommendation, production-readiness-review]

constraints:
  no_role_may:
    - sign_evidence
    - modify_governance_files
    - bypass_critical_gate
    - claim_verification_without_evidence
    - self_confirm_security_finding
  only_release_manager_may:
    - issue_release_decision
  only_security_engineer_may:
    - request_tsar_assessment
    - interpret_tsar_findings
