[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "arkhon"
version = "0.1.0.dev1"
description = "Software Engineering Governance & Assurance System"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Mohamed Elghazali" }]
keywords = ["governance", "software-engineering", "verification", "ai-agents", "quality-assurance"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml==6.0.2", "jsonschema==4.23.0", "defusedxml==0.7.1"]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "ruff==0.7.4",
    "mypy==1.13.0",
    "bandit==1.7.10",
    "pip-audit==2.10.1",
    "sigstore==3.6.7",
    "check-jsonschema==0.29.4",
    "types-PyYAML==6.0.12.20240917",
]

[project.scripts]
arkhon = "arkhon.cli:main"

[project.urls]
Homepage = "https://github.com/mohamedelghazali/Apxoh"
Repository = "https://github.com/mohamedelghazali/Apxoh.git"
Issues = "https://github.com/mohamedelghazali/Apxoh/issues"
Security = "https://github.com/mohamedelghazali/Apxoh/security/policy"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arkhon = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S101", "T201"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
files = ["src", "tests", "scripts"]
exclude = ["src/arkhon/integrations/models/(openai-o|deepseek-coder|code-llama|qwen-coder)/"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scripts.*"]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --import-mode=importlib"
norecursedirs = [
    "tests/languages/fixtures/*",
    ".git",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
]


[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B404", "B603", "B607", "B105", "B310"]
